<!doctype html>
<html><head><meta charset="utf-8">
<!-- Mockup 3D de livro em brochura. Lê as faces (frente.jpg, lombada.jpg, verso.jpg) da própria pasta.
     Parâmetros na URL: w, h (tela), W, H, T (proporção do livro: largura, altura, lombada, em qualquer unidade),
     cena (pe | par | frente), s (escala), recorte=1 (fundo transparente), sem_lombada=1 (só frente). -->
<style>
:root{--W:1004px;--H:1417px;--T:126px}
*{box-sizing:border-box}
html,body{margin:0;width:var(--cw);height:var(--ch);overflow:hidden;background:transparent}
body{background:#e9eef2}
body.recorte{background:transparent}
.cena{position:absolute;inset:0;perspective:3200px;perspective-origin:50% 40%;filter:drop-shadow(18px 26px 26px rgba(10,30,45,.28))}
.livro{position:absolute;left:50%;top:50%;width:var(--W);height:var(--H);transform-style:preserve-3d}
.f{position:absolute;backface-visibility:hidden;background-size:100% 100%}
.frente{width:var(--W);height:var(--H);transform:translateZ(calc(var(--T)/2));background-image:url(frente.jpg)}
.verso{width:var(--W);height:var(--H);transform:rotateY(180deg) translateZ(calc(var(--T)/2));background-image:url(verso.jpg)}
.lombada{width:var(--T);height:var(--H);left:calc(var(--T)*-1);transform-origin:100% 50%;transform:translateZ(calc(var(--T)/2)) rotateY(-90deg);background-image:url(lombada.jpg)}
.miolo{width:calc(var(--T) - 2px);height:calc(var(--H) - 2px);top:1px;left:calc(var(--W) - 1px);transform-origin:0 50%;transform:translateZ(calc(var(--T)/2 - 1px)) rotateY(90deg);
  background:linear-gradient(90deg,#d9d2c3,#f6f1e6 18%,#f3eee2 82%,#d6cfbf),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px);background-blend-mode:multiply}
.topo{width:calc(var(--W) - 2px);height:calc(var(--T) - 2px);left:1px;top:calc((var(--T) - 2px)*-1 + 1px);transform-origin:50% 100%;transform:translateZ(calc(var(--T)/2 - 1px)) rotateX(90deg);background:linear-gradient(0deg,#e2dccd,#f6f1e6 30%,#f6f1e6 70%,#e2dccd),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px);background-blend-mode:multiply}
.base{width:var(--W);height:var(--T);top:var(--H);transform-origin:50% 0;transform:translateZ(calc(var(--T)/2)) rotateX(-90deg);background:#e7e1d3}
.frente::after,.verso::after,.lombada::after{content:"";position:absolute;inset:0}
/* vinco da brochura perto da lombada + luz suave */
.frente::after{background:
  linear-gradient(90deg,rgba(0,0,0,.18) 0,transparent 1.5%,transparent 3.6%,rgba(0,0,0,.10) 4.1%,rgba(255,255,255,.14) 4.6%,transparent 5.6%),
  linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%,rgba(0,0,0,.10) 100%)}
.lombada::after{background:linear-gradient(90deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.10) 22%,rgba(255,255,255,.10) 50%,rgba(0,0,0,.08) 78%,rgba(0,0,0,.30) 100%)}
.verso::after{background:linear-gradient(115deg,rgba(255,255,255,.10),rgba(0,0,0,.12))}
.sombra{position:absolute;border-radius:50%;filter:blur(14px);background:rgba(10,30,45,.45)}
</style></head>
<body>
<div class="cena" id="cena"></div>
<script>
const q=new URLSearchParams(location.search);
if(q.get('recorte'))document.body.classList.add('recorte');
const cw=+q.get('w')||1400, ch=+q.get('h')||1400;
const root=document.documentElement.style;
root.setProperty('--cw',cw+'px');root.setProperty('--ch',ch+'px');
// proporções do livro: altura fixa de 1417px na cena, largura e lombada proporcionais
const H=1417, W=Math.round(H*(+q.get('W')||1004)/(+q.get('H')||1417)), T=Math.max(4,Math.round(H*(+q.get('T')||126)/(+q.get('H')||1417)));
root.setProperty('--W',W+'px');root.setProperty('--H',H+'px');root.setProperty('--T',T+'px');
const c=document.getElementById('cena'), cena=q.get('cena')||'pe', chao=ch*.86;
const k=ch*.74/H; // s=1 → livro ocupa ~74% da altura da tela
const pos=(s)=>`translate(-50%,-50%) translate(0px,${chao - ch/2 - s*k*H/2}px) scale(${s*k})`;
const contato=(x,w)=>`<div class="sombra" style="left:${x-w/2}px;top:${chao-14}px;width:${w}px;height:28px"></div>`;
const faces=()=>`<div class="f verso"></div><div class="f base"></div><div class="f topo"></div><div class="f miolo"></div><div class="f lombada"></div><div class="f frente"></div>`;
const livro=(t)=>`<div class="livro" style="transform:${t}">${faces()}</div>`;
if(cena==='pe'){          // em pé, 3/4, mostrando a lombada (precisa de lombada medida)
  const s=+q.get('s')||0.60;
  c.innerHTML=contato(cw/2+cw*.05,s*k*W*1.05)+livro(`translateX(${cw*.05}px) ${pos(s)} rotateX(-3deg) rotateY(34deg)`);
}else if(cena==='frente'){ // em pé, girado para o outro lado: mostra frente e o bloco de páginas, sem lombada
  const s=+q.get('s')||0.62;
  c.innerHTML=contato(cw/2-cw*.03,s*k*W*1.02)+livro(`translateX(${-cw*.03}px) ${pos(s)} rotateX(-3deg) rotateY(-24deg)`);
}else if(cena==='par'){   // frente e contracapa lado a lado (precisa do verso)
  const s=+q.get('s')||0.52;
  c.innerHTML=contato(cw*.34,s*k*W*.95)+contato(cw*.66,s*k*W)+
    livro(`translateX(-${cw*.17}px) ${pos(s*.95)} rotateY(-148deg)`)+
    livro(`translateX(${cw*.15}px) ${pos(s)} rotateY(24deg)`);
}
</script>
</body></html>
